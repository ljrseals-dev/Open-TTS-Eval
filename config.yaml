# Open TTS eval harness config
# Swap model section for different adapters / checkpoints.

model:
  adapter: "piper"                    # "piper" or "hf"
  model_path: "voices/en_US-lessac-medium.onnx"
  # config_path: null                 # optional explicit Piper config
  name: "piper-lessac-medium"

  # Example HF alternative:
  # adapter: "hf"
  # id: "facebook/mms-tts-eng"
  # name: "mms-tts-eng"

dataset: "datasets/sample_ljspeech.jsonl"
metrics: [wer, rtfx, ttfa, utmos]     # drop any metric you don't want
asr_model: "base"                     # Whisper size for WER (tiny/base/small/...)
output: "results.json"
